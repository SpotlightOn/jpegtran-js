name: Test

on:
  push:
    branches: ["**"]
  pull_request:

env:
  FORCE_COLOR: 2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 12
          cache: true
          require-lockfile: true

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16

      - name: Install libjpeg-turbo tools (jpegtran, djpeg)
        run: sudo apt-get update && sudo apt-get install -y libjpeg-turbo-progs

      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm run test:simple
      - run: pnpm run test:crop
