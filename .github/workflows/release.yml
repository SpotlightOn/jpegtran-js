name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_COLOR: 2
  NODE: 24 # The Node.js version to publish from

permissions:
  contents: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    env:
      # setup-node writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into
      # $NPM_CONFIG_USERCONFIG, so the token has to be under this exact name. Writing ~/.npmrc
      # instead would be ignored, because NPM_CONFIG_USERCONFIG overrides it.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE }}
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org/"

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16

      - name: Install libjpeg-turbo tools (jpegtran, djpeg)
        run: sudo apt-get update && sudo apt-get install -y libjpeg-turbo-progs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (ensure dist is up to date)
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Run the smoke test
        run: pnpm run test:simple

      - name: Run the crop test
        run: pnpm run test:crop

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json has $PACKAGE_VERSION, tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Publish to npm
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} already published, skipping npm publish"
          else
            pnpm publish --no-git-checks --access public
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="release-notes.md"
          if [ -f "CHANGELOG.md" ]; then
            awk -v ver="$VERSION" '
              $0 ~ ("^## \\[" ver "\\] ") {flag=1; print; next}
              flag && /^## \[/ {exit}
              flag {print}
            ' CHANGELOG.md > "$NOTES_FILE" || true
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Full Changelog: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" > "$NOTES_FILE"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, updating its notes."
            gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          fi
